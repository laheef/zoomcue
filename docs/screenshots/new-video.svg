<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#dff5e8"/><stop offset="1" stop-color="#effaf3"/></linearGradient></defs><rect width="1440" height="900" fill="#f7faf8"/><rect width="235" height="900" fill="#17231d"/><text x="35" y="60" fill="#fff" font-size="25" font-family="Arial" font-weight="bold">✦ ZoomCue</text><text x="36" y="80" fill="#9cb7a5" font-size="11" font-family="Arial">Narrated walkthroughs</text><rect x="20" y="120" width="195" height="40" rx="8" fill="#2d8f5b"/><text x="40" y="146" fill="#fff" font-size="14" font-family="Arial">＋ New video</text><text x="40" y="190" fill="#c6d7cd" font-size="13" font-family="Arial">✧ Ideas</text><text x="35" y="265" fill="#7e9d8a" font-size="10" font-family="Arial">RECENT VIDEOS</text><text x="55" y="310" fill="#effaf3" font-size="12" font-family="Arial">Getting started with Acme</text><text x="55" y="335" fill="#8daa99" font-size="11" font-family="Arial">1:24 · yesterday</text><rect x="235" width="1205" height="70" fill="#fff"/><text x="280" y="43" fill="#9aa89e" font-size="13" font-family="Arial">Videos / New video</text><text x="280" y="135" fill="#80a08b" font-size="11" font-family="Arial" letter-spacing="2">CREATE A WALKTHROUGH</text><text x="280" y="180" fill="#1b2b22" font-size="34" font-family="Arial" font-weight="bold">What do you want to show?</text><text x="280" y="210" fill="#8a9990" font-size="14" font-family="Arial">Give us a page and a direction. ZoomCue will explore it, narrate it, and make the video.</text><rect x="280" y="255" width="760" height="145" rx="12" fill="#fff" stroke="#dce9e0"/><text x="310" y="293" fill="#26372d" font-size="16" font-family="Arial" font-weight="bold">What to record</text><text x="310" y="320" fill="#96a399" font-size="12" font-family="Arial">We'll explore the page before writing anything.</text><rect x="310" y="340" width="690" height="40" rx="7" fill="#fff" stroke="#cadbd0"/><text x="330" y="365" fill="#4c6355" font-size="12" font-family="Arial">◎  https://docs.acme.dev/getting-started</text><rect x="280" y="425" width="760" height="280" rx="12" fill="#fff" stroke="#dce9e0"/><text x="310" y="465" fill="#26372d" font-size="16" font-family="Arial" font-weight="bold">Brief</text><text x="310" y="492" fill="#96a399" font-size="12" font-family="Arial">Tell the narrator what to cover, in what order, and the tone.</text><rect x="310" y="515" width="220" height="32" rx="7" fill="#e5f6ea"/><text x="330" y="536" fill="#2d8f5b" font-size="11" font-family="Arial" font-weight="bold">Write it for me</text><text x="310" y="585" fill="#91a096" font-size="10" font-family="Arial">STARTER TEMPLATES</text><rect x="310" y="605" width="155" height="28" rx="15" fill="#f2f8f4" stroke="#b9d8c3"/><text x="325" y="623" fill="#47705a" font-size="10" font-family="Arial">Getting started</text><rect x="475" y="605" width="125" height="28" rx="15" fill="#f2f8f4" stroke="#b9d8c3"/><text x="490" y="623" fill="#47705a" font-size="10" font-family="Arial">Feature tour</text><rect x="310" y="650" width="690" height="38" rx="6" fill="#fbfdfb" stroke="#d7e5db"/><text x="325" y="674" fill="#a0ada5" font-size="11" font-family="Arial">What to cover, in what order, and the tone...</text><rect x="1070" y="255" width="300" height="450" rx="12" fill="#fff" stroke="#dce9e0"/><text x="1100" y="295" fill="#93a198" font-size="10" font-family="Arial" letter-spacing="1">ESTIMATE</text><text x="1100" y="345" fill="#1b2b22" font-size="23" font-family="Arial" font-weight="bold">About 5 minutes</text><text x="1100" y="375" fill="#94a098" font-size="11" font-family="Arial">Explore, write, check, narrate, render.</text><line x1="1100" y1="405" x2="1340" y2="405" stroke="#e1ebe4"/><text x="1100" y="445" fill="#2d8f5b" font-size="12" font-family="Arial">✓  Explore target</text><text x="1100" y="480" fill="#2d8f5b" font-size="12" font-family="Arial">✓  Write &amp; dry-run</text><text x="1100" y="515" fill="#2d8f5b" font-size="12" font-family="Arial">✓  Record &amp; render</text><rect x="1100" y="570" width="240" height="44" rx="7" fill="#2d8f5b"/><text x="1160" y="598" fill="#fff" font-size="13" font-family="Arial" font-weight="bold">Create video →</text></svg>