<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#17231d"/><text x="640" y="170" text-anchor="middle" fill="white" font-family="Arial" font-size="64" font-weight="bold">✦ ZoomCue</text><text x="640" y="235" text-anchor="middle" fill="#b7d2c0" font-family="Arial" font-size="26">From URL to audited walkthrough</text><g font-family="Arial" font-size="24" fill="#6fcf97" text-anchor="middle"><text x="160" y="400">Explore</text><text x="350" y="400">Write</text><text x="540" y="400">Dry-run</text><text x="730" y="400">Narrate</text><text x="920" y="400">Audit</text><text x="1110" y="400">Render</text></g><g fill="#6fcf97"><circle cx="160" cy="350" r="18"><animate attributeName="fill" values="#6fcf97;#ffffff;#6fcf97" dur="6s" repeatCount="indefinite"/></circle><circle cx="350" cy="350" r="18"><animate attributeName="fill" values="#6fcf97;#ffffff;#6fcf97" dur="6s" begin="1s" repeatCount="indefinite"/></circle><circle cx="540" cy="350" r="18"><animate attributeName="fill" values="#6fcf97;#ffffff;#6fcf97" dur="6s" begin="2s" repeatCount="indefinite"/></circle><circle cx="730" cy="350" r="18"><animate attributeName="fill" values="#6fcf97;#ffffff;#6fcf97" dur="6s" begin="3s" repeatCount="indefinite"/></circle><circle cx="920" cy="350" r="18"><animate attributeName="fill" values="#6fcf97;#ffffff;#6fcf97" dur="6s" begin="4s" repeatCount="indefinite"/></circle><circle cx="1110" cy="350" r="18"><animate attributeName="fill" values="#6fcf97;#ffffff;#6fcf97" dur="6s" begin="5s" repeatCount="indefinite"/></circle></g><line x1="160" y1="350" x2="1110" y2="350" stroke="#507a61" stroke-width="5"/><text x="640" y="560" text-anchor="middle" fill="#dff5e8" font-family="Arial" font-size="22">Every selector, cue, crop, and asset is checked before download.</text></svg>